<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    initializeFirestore,
    collection,
    doc,
    getDocs,
    updateDoc,
    setDoc,
    onSnapshot,
    writeBatch
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyArqDgHaf0l4yNNEAXeEBACMG4clfoHTfw",

    authDomain:
    "sistema-digital-f9df1.firebaseapp.com",

    projectId:
    "sistema-digital-f9df1",

    storageBucket:
    "sistema-digital-f9df1.firebasestorage.app",

    messagingSenderId:
    "783545984661",

    appId:
    "1:783545984661:web:5d0945907ad9db3990dd9c"

};


const app =
    initializeApp(firebaseConfig);


/*
   MESMA CONFIGURAÇÃO QUE FUNCIONOU NO CARDÁPIO
*/

const db =
    initializeFirestore(
        app,
        {},
        "default"
    );


console.log(
    "🔥 Painel conectado ao Firestore Enterprise!"
);


/* =========================================================
   VARIÁVEIS
========================================================= */

const CHAVE_MESAS =
    "quantidadeMesas";

let pedidos = [];

let historico = [];

let mesaSelecionada = null;


/* =========================================================
   VARIÁVEIS DOS AVISOS E SOM
========================================================= */

let idsPedidosConhecidos =
    new Set();

let primeiraCargaPedidos =
    true;

let somLiberado =
    false;

let audioContext =
    null;


/* =========================================================
   SOM
========================================================= */

window.ativarSom =
function(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }


        somLiberado =
            true;


        document.getElementById(
            "btnSom"
        ).innerText =
            "🔊 Som ativo";


        document.getElementById(
            "btnSom"
        ).style.background =
            "#166534";


        tocarSomAviso();

    }

    catch(erro){

        console.error(
            "Erro ao ativar som:",
            erro
        );

    }

};


function tocarSomAviso(){

    if(!somLiberado)
        return;


    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }


        const agora =
            audioContext.currentTime;


        const oscilador =
            audioContext.createOscillator();


        const ganho =
            audioContext.createGain();


        oscilador.type =
            "sine";


        oscilador.frequency.setValueAtTime(
            880,
            agora
        );


        oscilador.frequency.setValueAtTime(
            660,
            agora + 0.15
        );


        ganho.gain.setValueAtTime(
            0.001,
            agora
        );


        ganho.gain.exponentialRampToValueAtTime(
            0.25,
            agora + 0.03
        );


        ganho.gain.exponentialRampToValueAtTime(
            0.001,
            agora + 0.45
        );


        oscilador.connect(
            ganho
        );


        ganho.connect(
            audioContext.destination
        );


        oscilador.start(
            agora
        );


        oscilador.stop(
            agora + 0.5
        );

    }

    catch(erro){

        console.error(
            "Erro no som:",
            erro
        );

    }

}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function formatarDinheiro(valor){

    return Number(valor || 0)
        .toFixed(2)
        .replace(".",",");

}


function obterDataHoje(){

    return new Date()
        .toLocaleDateString("pt-BR");

}


function obterQuantidadeMesas(){

    return Number(
        localStorage.getItem(
            CHAVE_MESAS
        ) || 8
    );

}


/* =========================================================
   QUANTIDADE DE MESAS
========================================================= */

window.salvarQuantidadeMesas =
function(){

    let quantidade =
        Number(
            document.getElementById(
                "quantidadeMesas"
            ).value
        );


    if(quantidade < 1)
        quantidade = 1;


    if(quantidade > 100)
        quantidade = 100;


    localStorage.setItem(
        CHAVE_MESAS,
        quantidade
    );


    document.getElementById(
        "quantidadeMesas"
    ).value =
        quantidade;


    renderizarMesas();

};


/* =========================================================
   NORMALIZAR STATUS
========================================================= */

function normalizarStatus(status){

    return String(
        status || "Recebido"
    )
    .trim()
    .toLowerCase();

}


/* =========================================================
   FIREBASE - PEDIDOS
========================================================= */

function carregarPedidosFirebase(){

    const referencia =
        collection(
            db,
            "pedidos"
        );


    onSnapshot(

        referencia,

        snapshot => {

            const pedidosAnteriores =
                pedidos;


            pedidos = [];


            snapshot.forEach(
                documento => {

                    const dados =
                        documento.data();


                    pedidos.push({

                        id:
                        documento.id,

                        ...dados,

                        status:
                        normalizarStatus(
                            dados.status
                        )

                    });

                }
            );


            console.log(
                "📦 Pedidos carregados:",
                pedidos.length
            );


            /* =================================================
               DETECTAR NOVOS PEDIDOS
            ================================================= */

            const novosPedidos =
                pedidos.filter(
                    pedido =>

                        !idsPedidosConhecidos.has(
                            pedido.id
                        )

                        &&

                        normalizarStatus(
                            pedido.status
                        ) ===
                        "recebido"

                );


            /*
               Na primeira carga não toca som,
               para não tocar pedidos antigos.
            */

            if(
                !primeiraCargaPedidos &&
                novosPedidos.length
            ){

                tocarSomAviso();

            }


            pedidos.forEach(
                pedido => {

                    idsPedidosConhecidos.add(
                        pedido.id
                    );

                }
            );


            primeiraCargaPedidos =
                false;


            renderizarMesas();

            renderizarAvisos();


            if(mesaSelecionada){

                renderizarComanda();

            }

        },

        erro => {

            console.error(
                "Erro ao carregar pedidos:",
                erro
            );


            alert(
                "❌ Erro ao carregar os pedidos do Firebase.\n\n" +
                (
                    erro.message ||
                    erro
                )
            );

        }

    );

}


/* =========================================================
   RENDERIZAR AVISOS
========================================================= */

function renderizarAvisos(){

    const lista =
        document.getElementById(
            "listaAvisos"
        );


    const contador =
        document.getElementById(
            "contadorAvisos"
        );


    /*
       Mostra somente pedidos ainda abertos.
       Finalizados ficam fora dos avisos.
    */

    const pedidosAbertos =
        pedidos.filter(
            pedido =>
                normalizarStatus(
                    pedido.status
                ) !==
                "finalizado"
        );


    /*
       Ordena:
       Recebido primeiro
       Em preparo depois
       Pronto por último
    */

    const prioridade = {

        recebido:1,

        preparo:2,

        pronto:3

    };


    pedidosAbertos.sort(
        (a,b) => {

            return (
                prioridade[
                    normalizarStatus(a.status)
                ] || 99
            )
            -
            (
                prioridade[
                    normalizarStatus(b.status)
                ] || 99
            );

        }
    );


    contador.innerText =
        pedidosAbertos.length;


    if(!pedidosAbertos.length){

        lista.innerHTML = `

            <div class="sem-avisos">

                ✅ Nenhum pedido aguardando atenção.

            </div>

        `;

        return;

    }


    lista.innerHTML = "";


    pedidosAbertos.forEach(
        pedido => {

            const status =
                normalizarStatus(
                    pedido.status
                );


            let classe =
                "aviso-novo";


            let classeStatus =
                "aviso-status-novo";


            let textoStatus =
                "🔴 Novo pedido";


            if(
                status ===
                "preparo"
            ){

                classe =
                    "aviso-preparo";


                classeStatus =
                    "aviso-status-preparo";


                textoStatus =
                    "🟠 Em preparo";

            }


            if(
                status ===
                "pronto"
            ){

                classe =
                    "aviso-pronto";


                classeStatus =
                    "aviso-status-pronto";


                textoStatus =
                    "🔵 Pronto";

            }


            const numeroPedido =
                pedido.numeroPedido ||
                pedido.numero ||
                "—";


            const mesa =
                pedido.mesa ||
                "—";


            const aviso =
                document.createElement(
                    "div"
                );


            aviso.className =
                "aviso-item " +
                classe;


            aviso.innerHTML = `

                <div class="aviso-info">

                    <span class="aviso-mesa">

                        🪑 Mesa ${mesa}

                    </span>

                    <span class="aviso-detalhes">

                        Pedido #${numeroPedido}

                    </span>

                </div>

                <span
                    class="
                        aviso-status
                        ${classeStatus}
                    "
                >

                    ${textoStatus}

                </span>

            `;


            aviso.onclick =
                function(){

                    abrirComanda(
                        Number(mesa)
                    );

                };


            lista.appendChild(
                aviso
            );

        }
    );

}


/* =========================================================
   FIREBASE - HISTÓRICO
========================================================= */

function carregarHistoricoFirebase(){

    const referencia =
        collection(
            db,
            "historicoComandas"
        );


    onSnapshot(

        referencia,

        snapshot => {

            historico = [];


            snapshot.forEach(
                documento => {

                    historico.push({

                        id:
                        documento.id,

                        ...documento.data()

                    });

                }
            );


            historico.sort(
                (a,b) => {

                    return new Date(
                        b.dataFinalizacao ||
                        b.dataCriacao ||
                        0
                    )
                    -
                    new Date(
                        a.dataFinalizacao ||
                        a.dataCriacao ||
                        0
                    );

                }
            );


            atualizarResumo();

        },

        erro => {

            console.error(
                "Erro histórico:",
                erro
            );

        }

    );

}


/* =========================================================
   PEDIDOS DA MESA
========================================================= */

function pedidosDaMesa(numeroMesa){

    return pedidos.filter(
        pedido =>

            String(
                pedido.mesa
            ) ===
            String(
                numeroMesa
            )

            &&

            normalizarStatus(
                pedido.status
            ) !==
            "finalizado"

    );

}


/* =========================================================
   STATUS DA MESA
========================================================= */

function obterStatusMesa(numeroMesa){

    const pedidosMesa =
        pedidosDaMesa(
            numeroMesa
        );


    if(!pedidosMesa.length)
        return "livre";


    if(
        pedidosMesa.some(
            pedido =>
            normalizarStatus(
                pedido.status
            ) === "pronto"
        )
    )
        return "pronto";


    if(
        pedidosMesa.some(
            pedido =>
            normalizarStatus(
                pedido.status
            ) === "preparo"
        )
    )
        return "preparo";


    return "ocupada";

}


/* =========================================================
   RESPONSÁVEL
========================================================= */

function obterResponsavel(
    pedidosMesa
){

    if(!pedidosMesa.length)
        return "—";


    const pedido =
        pedidosMesa.find(
            p =>
                p.responsavel ||
                p.nomeCliente
        );


    if(!pedido)
        return "Não informado";


    return (
        pedido.responsavel ||
        pedido.nomeCliente
    );

}


/* =========================================================
   TOTAL DA MESA
========================================================= */

function calcularTotalMesa(
    pedidosMesa
){

    return pedidosMesa.reduce(

        (total,pedido) =>

            total +
            Number(
                pedido.total || 0
            ),

        0

    );

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo(){

    const quantidade =
        obterQuantidadeMesas();


    let livres = 0;

    let ocupadas = 0;

    let pedidosAbertos = 0;


    for(
        let mesa = 1;
        mesa <= quantidade;
        mesa++
    ){

        const pedidosMesa =
            pedidosDaMesa(
                mesa
            );


        if(!pedidosMesa.length)
            livres++;

        else
            ocupadas++;


        pedidosAbertos +=
            pedidosMesa.length;

    }


    const hoje =
        obterDataHoje();


    const historicoHoje =
        historico.filter(
            item =>
                item.data === hoje
        );


    const totalVendido =
        historicoHoje.reduce(

            (total,item) =>

                total +
                Number(
                    item.total || 0
                ),

            0

        );


    document.getElementById(
        "totalLivres"
    ).innerText =
        livres;


    document.getElementById(
        "totalOcupadas"
    ).innerText =
        ocupadas;


    document.getElementById(
        "totalPedidosAbertos"
    ).innerText =
        pedidosAbertos;


    document.getElementById(
        "totalMesasFinalizadas"
    ).innerText =
        historicoHoje.length;


    document.getElementById(
        "totalVendidoHoje"
    ).innerText =
        "R$ " +
        formatarDinheiro(
            totalVendido
        );

}

        const status =
            obterStatusMesa(

            );


        const total =

            );

            );

window.abrirComanda =

/* =========================================================
   RENDERIZAR COMANDA
========================================================= */

function renderizarComanda(){

    if(!mesaSelecionada)
        return;


    const pedidosMesa =
        pedidosDaMesa(
            mesaSelecionada
        );


    const total =
        calcularTotalMesa(
            pedidosMesa
        );


    const responsavel =
        obterResponsavel(
            pedidosMesa
        );


    document.getElementById(
        "responsavelComanda"
    ).innerHTML = `

        👤
        <strong>
            Responsável:
        </strong>

        ${responsavel}

    `;


    const lista =
        document.getElementById(
            "listaComanda"
        );


    lista.innerHTML = "";


    if(!pedidosMesa.length){

        lista.innerHTML = `

            <div class="sem-pedidos">

                🟢 Esta mesa está livre.

            </div>

        `;

    }

    else{

        pedidosMesa
        .sort(
            (a,b) => {

                const numeroA =
                    Number(
                        a.numeroPedido ||
                        a.numero ||
                        0
                    );


                const numeroB =
                    Number(
                        b.numeroPedido ||
                        b.numero ||
                        0
                    );


                return numeroA - numeroB;

            }
        )
        .forEach(
            pedido => {

                const bloco =
                    document.createElement(
                        "div"
                    );


                bloco.className =
                    "pedido-bloco";


                const status =
                    normalizarStatus(
                        pedido.status
                    );


                let classeStatus =
                    "status-recebido";


                let textoStatus =
                    "🔴 Recebido";


                if(
                    status === "preparo"
                ){

                    classeStatus =
                        "status-preparo-pedido";


                    textoStatus =
                        "🟠 Em preparo";

                }


                if(
                    status === "pronto"
                ){

                    classeStatus =
                        "status-pronto-pedido";


                    textoStatus =
                        "🔵 Pronto";

                }


                let itensHTML =
                    "";


                (
                    pedido.itens ||
                    []
                )
                .forEach(
                    item => {

                        itensHTML += `

                            <div class="item">

                                <div class="item-linha">

                                    <span
                                        class="item-nome"
                                    >

                                        ${
                                            item.quantidade
                                        }x

                                        ${
                                            item.nome
                                        }

                                    </span>

                                    <span>

                                        R$

                                        ${
                                            formatarDinheiro(
                                                Number(
                                                    item.preco ||
                                                    0
                                                ) *
                                                Number(
                                                    item.quantidade ||
                                                    0
                                                )
                                            )
                                        }

                                    </span>

                                </div>

                                ${
                                    item.observacao
                                    ?
                                    `

                                    <div class="item-obs">

                                        📝 OBS:
                                        ${item.observacao}

                                    </div>

                                    `
                                    :
                                    ""
                                }

                            </div>

                        `;

                    }
                );


                const numeroPedido =
                    pedido.numeroPedido ||
                    pedido.numero ||
                    "—";


                const dataPedido =
                    pedido.data
                    ?
                    new Date(
                        pedido.data
                    )
                    :
                    null;


                const horario =
                    dataPedido &&
                    !isNaN(
                        dataPedido
                    )
                    ?
                    dataPedido.toLocaleTimeString(
                        "pt-BR",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    )
                    :
                    "--:--";


                bloco.innerHTML = `

                    <div class="pedido-cabecalho">

                        <span>

                            <strong>

                                Pedido #${numeroPedido}

                            </strong>

                            <br>

                            🕐 ${horario}

                        </span>

                        <span
                            class="
                                pedido-status
                                ${classeStatus}
                            "
                        >

                            ${textoStatus}

                        </span>

                    </div>

                    ${itensHTML}

                    <div class="botoes-status">

                        <button
                            class="
                                btn-status
                                btn-recebido
                                ${
                                    status === "recebido"
                                    ?
                                    "ativo"
                                    :
                                    ""
                                }
                            "
                            onclick="
                                alterarStatusPedido(
                                    '${pedido.id}',
                                    'recebido'
                                )
                            "
                        >
                            🔴 Recebido
                        </button>

                        <button
                            class="
                                btn-status
                                btn-preparo
                                ${
                                    status === "preparo"
                                    ?
                                    "ativo"
                                    :
                                    ""
                                }
                            "
                            onclick="
                                alterarStatusPedido(
                                    '${pedido.id}',
                                    'preparo'
                                )
                            "
                        >
                            🟠 Em preparo
                        </button>

                        <button
                            class="
                                btn-status
                                btn-pronto
                                ${
                                    status === "pronto"
                                    ?
                                    "ativo"
                                    :
                                    ""
                                }
                            "
                            onclick="
                                alterarStatusPedido(
                                    '${pedido.id}',
                                    'pronto'
                                )
                            "
                        >
                            🔵 Pronto
                        </button>

                    </div>

                `;


                lista.appendChild(
                    bloco
                );

            }
        );

    }


    document.getElementById(
        "totalComanda"
    ).innerText =
        formatarDinheiro(
            total
        );

}


/* =========================================================
   ALTERAR STATUS
========================================================= */

window.alterarStatusPedido =
async function(
    id,
    novoStatus
){

    try{

        const referencia =
            doc(
                db,
                "pedidos",
                id
            );


        await updateDoc(
            referencia,
            {

                status:
                    novoStatus

            }
        );


        console.log(
            "✅ Status atualizado:",
            novoStatus
        );

    }

    catch(erro){

        console.error(
            "Erro ao atualizar status:",
            erro
        );


        alert(

            "❌ Erro ao atualizar pedido.\n\n" +

            (
                erro.message ||
                erro
            )

        );

    }

};


/* =========================================================
   FECHAR COMANDA
========================================================= */

window.fecharComanda =
function(){

    document.getElementById(
        "modalComanda"
    ).style.display =
        "none";


    mesaSelecionada =
        null;

};


/* =========================================================
   FINALIZAR MESA
========================================================= */

window.finalizarMesa =
async function(){

    if(!mesaSelecionada)
        return;


    const pedidosMesa =
        pedidosDaMesa(
            mesaSelecionada
        );


    if(!pedidosMesa.length){

        alert(
            "Esta mesa não possui pedidos."
        );

        return;

    }


    const total =
        calcularTotalMesa(
            pedidosMesa
        );


    const responsavel =
        obterResponsavel(
            pedidosMesa
        );


    const confirmar =
        confirm(

            "Finalizar Comanda da Mesa " +
            mesaSelecionada +

            "?\n\n" +

            "Responsável: " +
            responsavel +

            "\n" +

            "Total: R$ " +
            formatarDinheiro(
                total
            ) +

            "\n\n" +

            "A mesa será liberada."

        );


    if(!confirmar)
        return;


    try{

        const agora =
            new Date();


        const batch =
            writeBatch(db);


        pedidosMesa.forEach(
            pedido => {

                const pedidoRef =
                    doc(
                        db,
                        "pedidos",
                        pedido.id
                    );


                batch.update(
                    pedidoRef,
                    {

                        status:
                            "finalizado",

                        dataFinalizacao:
                            agora.toISOString()

                    }
                );

            }
        );


        const historicoRef =
            doc(
                collection(
                    db,
                    "historicoComandas"
                )
            );


        batch.set(
            historicoRef,
            {

                mesa:
                    mesaSelecionada,

                responsavel:
                    responsavel,

                total:
                    Number(
                        total.toFixed(2)
                    ),

                data:
                    agora.toLocaleDateString(
                        "pt-BR"
                    ),

                horarioFinalizacao:
                    agora.toLocaleTimeString(
                        "pt-BR",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    ),

                dataFinalizacao:
                    agora.toISOString(),

                pedidos:
                    pedidosMesa.map(
                        pedido => ({

                            id:
                                pedido.id,

                            numeroPedido:
                                pedido.numeroPedido ||
                                pedido.numero ||
                                0,

                            total:
                                Number(
                                    pedido.total ||
                                    0
                                ),

                            itens:
                                pedido.itens ||
                                []

                        })
                    )

            }

        );


        await batch.commit();


        const mesaFinalizada =
            mesaSelecionada;


        fecharComanda();


        alert(

            "✅ Comanda finalizada!\n\n" +

            "Mesa " +
            mesaFinalizada +
            " liberada.\n\n" +

            "Total: R$ " +
            formatarDinheiro(
                total
            )

        );

    }

    catch(erro){

        console.error(
            "Erro ao finalizar:",
            erro
        );


        alert(

            "❌ Erro ao finalizar comanda.\n\n" +

            (
                erro.message ||
                erro
            )

        );

    }

};
