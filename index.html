      box-shadow: 0 4px 15px rgba(0,0,0,0.3);

      cursor: pointer;
    }

    .carrinho-flutuante button {
      background: white;
      color: #b71c1c;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-fundo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      overflow-y: auto;
      padding: 15px;
    }

    .modal {
      background: white;
      max-width: 600px;
      margin: 20px auto;
      border-radius: 15px;
      padding: 20px;
    }

    .modal h2 {
      margin-bottom: 15px;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo input,
    .campo textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .campo textarea {
      min-height: 80px;
      resize: vertical;
    }

    .item-carrinho {
      border-bottom: 1px solid #ddd;

    }

    .item-carrinho-topo {

    }

    .quantidade {

      cursor: pointer;
    }

    .observacao-item {
      width: 100%;

      border-radius: 6px;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      text-align: right;
      margin: 20px 0;
    }

    .botoes-modal {
      display: flex;
      gap: 10px;
    }

    .botoes-modal button {
      flex: 1;

      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-fechar {
      background: #ddd;

    }

    .btn-enviar {

    }

    }

<script type="module">

  /*

  /*

  /*
  ============================================================
  VARIÁVEIS
  ============================================================
  */

  let pedido = [];

  let categoriaAtual = "Todos";


  const TELEFONE_WHATSAPP =
    "5549984121585";


  /*
  ============================================================
  FUNÇÕES
  ============================================================
  */

  function formatarPreco(valor) {

    return Number(valor).toLocaleString(
      "pt-BR",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

  }


  function obterTotal() {

    return pedido.reduce(

      (total, item) => {

        return total +
          (Number(item.preco) *
           Number(item.quantidade));

      },

      0

    );

  }


  function atualizarCarrinho() {

    const quantidade =
      pedido.reduce(
        (total, item) =>
          total + Number(item.quantidade),
        0
      );


    document.getElementById(
      "quantidadeCarrinho"
    ).textContent = quantidade;


    document.getElementById(
      "totalCarrinho"
    ).textContent =
      formatarPreco(obterTotal());


    document.getElementById(
      "totalModal"
    ).textContent =
      formatarPreco(obterTotal());

  }


  /*
  ============================================================
  MOSTRAR PRODUTOS
  ============================================================
  */

  function mostrarProdutos() {

    const lista =
      document.getElementById(
        "listaProdutos"
      );


    lista.innerHTML = "";


    let produtosFiltrados;


    if (categoriaAtual === "Todos") {

      produtosFiltrados = produtos;

    } else {

      produtosFiltrados =
        produtos.filter(
          produto =>
            produto.categoria === categoriaAtual
        );

    }


    if (produtosFiltrados.length === 0) {

      lista.innerHTML =
        `<div class="vazio">
          Nenhum produto encontrado.
        </div>`;

      return;

    }


    produtosFiltrados.forEach(produto => {

      const div =
        document.createElement("div");


      div.className = "produto";


      div.innerHTML = `

        <h3>${produto.nome}</h3>

        <p>${produto.descricao}</p>

        <div class="produto-baixo">

          <span class="preco">
            R$ ${formatarPreco(produto.preco)}
          </span>

          <button
            class="btn-adicionar"
            onclick="adicionarProduto(${produto.id})">

            ➕ Adicionar

          </button>

        </div>

      `;


      lista.appendChild(div);

    });

  }


  /*
  ============================================================
  FILTRO
  ============================================================
  */

  window.filtrarCategoria =
    function(categoria, botao) {

      categoriaAtual = categoria;


      document
        .querySelectorAll(".categorias button")
        .forEach(btn =>
          btn.classList.remove("ativo")
        );


      botao.classList.add("ativo");


      mostrarProdutos();

    };


  /*
  ============================================================
  ADICIONAR PRODUTO
  ============================================================
  */

  window.adicionarProduto =
    function(id) {

      const produto =
        produtos.find(
          p => p.id === id
        );


      if (!produto) return;


      const existente =
        pedido.find(
          item => item.id === id
        );


      if (existente) {

        existente.quantidade++;

      } else {

        pedido.push({

          id: produto.id,

          nome: produto.nome,

          preco: produto.preco,

          categoria: produto.categoria,

          quantidade: 1,

          observacao: ""

        });

      }


      atualizarCarrinho();


      console.log(
        "Produto adicionado:",
        produto.nome
      );

    };


  /*
  ============================================================
  ABRIR CARRINHO
  ============================================================
  */

  window.abrirCarrinho =
    function() {

      mostrarCarrinho();


      document.getElementById(
        "modalCarrinho"
      ).style.display = "block";

    };


  /*
  ============================================================
  FECHAR CARRINHO
  ============================================================
  */

  window.fecharCarrinho =
    function() {

      document.getElementById(
        "modalCarrinho"
      ).style.display = "none";

    };


  /*
  ============================================================
  MOSTRAR CARRINHO
  ============================================================
  */

  function mostrarCarrinho() {

    const lista =
      document.getElementById(
        "listaCarrinho"
      );


    lista.innerHTML = "";


    if (pedido.length === 0) {

      lista.innerHTML =
        `<div class="vazio">
          Seu carrinho está vazio.
        </div>`;

      atualizarCarrinho();

      return;

    }


    pedido.forEach((item, index) => {

      const div =
        document.createElement("div");


      div.className =
        "item-carrinho";


      div.innerHTML = `

        <div class="item-carrinho-topo">

          <strong>
            ${item.nome}
          </strong>

          <strong>
            R$ ${formatarPreco(
              item.preco * item.quantidade
            )}
          </strong>

        </div>


        <div class="quantidade">

          <button
            onclick="diminuirQuantidade(${index})">
            −
          </button>

          <strong>
            ${item.quantidade}
          </strong>

          <button
            onclick="aumentarQuantidade(${index})">
            +
          </button>

          <button
            onclick="removerProduto(${index})">
            🗑️
          </button>

        </div>


        <input
          class="observacao-item"
          type="text"
          placeholder="Observação deste item"
          value="${item.observacao || ""}"
          onchange="alterarObservacao(${index}, this.value)"
        >

      `;


      lista.appendChild(div);

    });


    atualizarCarrinho();

  }


  /*
  ============================================================
  QUANTIDADES
  ============================================================
  */

  window.aumentarQuantidade =
    function(index) {

      if (!pedido[index]) return;

      pedido[index].quantidade++;

      mostrarCarrinho();

    };


  window.diminuirQuantidade =
    function(index) {

      if (!pedido[index]) return;


      if (pedido[index].quantidade > 1) {

        pedido[index].quantidade--;

      } else {

        pedido.splice(index, 1);

      }


      mostrarCarrinho();

    };


  window.removerProduto =
    function(index) {

      pedido.splice(index, 1);

      mostrarCarrinho();

    };


  window.alterarObservacao =
    function(index, valor) {

      if (pedido[index]) {

        pedido[index].observacao =
          valor;

      }

    };


  /*
  ============================================================
  HORÁRIO E DATA
  ============================================================
  */

  function obterHorario() {

    return new Date().toLocaleTimeString(
      "pt-BR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  function obterData() {

    return new Date().toLocaleDateString(
      "pt-BR"
    );

  }


  /*
  ============================================================
  NÚMERO DO PEDIDO

  Não usamos mais:
  getDocs(collection(db,"pedidos"))

  Portanto não precisamos baixar todos
  os pedidos para gerar o número.
  ============================================================
  */

  function gerarNumeroPedido() {

    const agora = new Date();


    const hora =
      String(agora.getHours())
        .padStart(2, "0");


    const minuto =
      String(agora.getMinutes())
        .padStart(2, "0");


    const segundo =
      String(agora.getSeconds())
        .padStart(2, "0");


    const milissegundo =
      String(agora.getMilliseconds())
        .padStart(3, "0");


    return `${hora}${minuto}${segundo}${milissegundo}`;

  }


  /*
  ============================================================
  SALVAR PEDIDO NO FIREBASE

  ESTA É A PRINCIPAL ALTERAÇÃO.
  ============================================================
  */

  async function salvarPedidoNoSistema() {

    console.log(
      "🔥 Iniciando gravação no Firebase..."
    );


    const ref =
      collection(db, "pedidos");


    const mesa =
      document.getElementById(
        "mesa"
      ).value.trim();


    const responsavel =
      document.getElementById(
        "responsavel"
      ).value.trim();


    const observacaoGeral =
      document.getElementById(
        "observacaoGeral"
      ).value.trim();


    const numero =
      gerarNumeroPedido();


    const pedidoSistema = {

      numero: numero,

      mesa: mesa,

      responsavel: responsavel,

      nomeCliente: responsavel,

      horario: obterHorario(),

      data: obterData(),

      status: "recebido",

      observacaoGeral:
        observacaoGeral,

      itens: pedido.map(item => ({

        nome: item.nome,

        preco: Number(item.preco),

        quantidade:
          Number(item.quantidade),

        categoria:
          item.categoria || "",

        observacao:
          item.observacao || ""

      })),

      total:
        Number(
          obterTotal().toFixed(2)
        ),

      dataCriacao:
        new Date().toISOString()

    };


    console.log(
      "📦 Pedido preparado:",
      pedidoSistema
    );


    /*
    ------------------------------------------------------------
    GRAVA DIRETAMENTE.
    NÃO FAZ getDocs ANTES.
    ------------------------------------------------------------
    */

    const docRef =
      await addDoc(
        ref,
        pedidoSistema
      );


    console.log(
      "✅ PEDIDO SALVO NO FIREBASE!",
      docRef.id
    );


    return {

      ...pedidoSistema,

      idFirebase: docRef.id

    };

  }


  /*
  ============================================================
  WHATSAPP
  ============================================================
  */

  function enviarWhatsApp(
    pedidoSistema
  ) {

    let mensagem =
      `🍔 *NOVO PEDIDO - SABOR DA CASA*%0A%0A`;


    mensagem +=
      `📋 *Pedido:* #${pedidoSistema.numero}%0A`;


    mensagem +=
      `🪑 *Mesa:* ${pedidoSistema.mesa}%0A`;


    mensagem +=
      `👤 *Responsável:* ${pedidoSistema.responsavel}%0A`;


    mensagem +=
      `📅 *Data:* ${pedidoSistema.data}%0A`;


    mensagem +=
      `⏰ *Horário:* ${pedidoSistema.horario}%0A%0A`;


    mensagem +=
      `*ITENS:*%0A`;


    pedidoSistema.itens.forEach(item => {

      mensagem +=
        `• ${item.quantidade}x ${item.nome} - R$ ${formatarPreco(item.preco * item.quantidade)}%0A`;


      if (item.observacao) {

        mensagem +=
          `  📝 ${item.observacao}%0A`;

      }

    });


    if (pedidoSistema.observacaoGeral) {

      mensagem +=
        `%0A📝 *Observação:* ${pedidoSistema.observacaoGeral}%0A`;

    }


    mensagem +=
      `%0A💰 *TOTAL: R$ ${formatarPreco(pedidoSistema.total)}*`;


    const url =
      `https://wa.me/${TELEFONE_WHATSAPP}?text=${mensagem}`;


    console.log(
      "📲 Abrindo WhatsApp..."
    );


    window.open(
      url,
      "_blank"
    );

  }


  /*
  ============================================================
  ENVIAR PEDIDO
  ============================================================
  */

  window.enviarPedido =
    async function() {

      const btn =
        document.getElementById(
          "btnEnviar"
        );


      const mesa =
        document.getElementById(
          "mesa"
        ).value.trim();


      const responsavel =
        document.getElementById(
          "responsavel"
        ).value.trim();


      /*
      ----------------------------------------------------------
      VALIDAÇÕES
      ----------------------------------------------------------
      */

      if (!mesa) {

        alert(
          "Informe o número da mesa."
        );

        document
          .getElementById("mesa")
          .focus();

        return;

      }


      if (!responsavel) {

        alert(
          "Informe o nome do responsável."
        );

        document
          .getElementById("responsavel")
          .focus();

        return;

      }


      if (pedido.length === 0) {

        alert(
          "Adicione pelo menos um produto."
        );

        return;

      }


      /*
      ----------------------------------------------------------
      BLOQUEIA O BOTÃO
      ----------------------------------------------------------
      */

      btn.disabled = true;

      btn.textContent =
        "⏳ Registrando...";


      try {

        console.log(
          "🚀 Enviando pedido..."
        );


        /*
        --------------------------------------------------------
        FIREBASE

        Agora existe somente UMA operação principal:
        addDoc()

        Não fazemos mais getDocs().
        --------------------------------------------------------
        */

        const pedidoSalvo =
          await salvarPedidoNoSistema();


        if (!pedidoSalvo) {

          throw new Error(
            "O Firebase não retornou o pedido salvo."
          );

        }


        console.log(
          "✅ Pedido registrado:",
          pedidoSalvo
        );


        /*
        --------------------------------------------------------
        SUCESSO
        --------------------------------------------------------
        */

        alert(
          `✅ Pedido #${pedidoSalvo.numero} registrado com sucesso!`
        );


        /*
        --------------------------------------------------------
        SÓ DEPOIS DO FIREBASE:
        ABRE O WHATSAPP
        --------------------------------------------------------
        */

        enviarWhatsApp(
          pedidoSalvo
        );


        /*
        --------------------------------------------------------
        LIMPA O PEDIDO
        --------------------------------------------------------
        */

        pedido = [];


        document.getElementById(
          "mesa"
        ).value = "";


        document.getElementById(
          "responsavel"
        ).value = "";


        document.getElementById(
          "observacaoGeral"
        ).value = "";


        atualizarCarrinho();


        fecharCarrinho();


      } catch (erro) {

        console.error(
          "❌ ERRO AO REGISTRAR:",
          erro
        );


        /*
        --------------------------------------------------------
        MENSAGEM DE ERRO
        --------------------------------------------------------
        */

        let mensagem =
          "Não foi possível registrar o pedido.";


        if (
          erro.code ===
          "permission-denied"
        ) {

          mensagem +=
            "\n\nO Firebase recusou o acesso. Verifique as regras do Firestore.";

        } else {

          mensagem +=
            "\n\nErro: " +
            (erro.message || erro);

        }


        alert(mensagem);


      } finally {

        /*
        --------------------------------------------------------
        DESBLOQUEIA O BOTÃO
        --------------------------------------------------------
        */

        btn.disabled = false;

        btn.textContent =
          "📲 Enviar Pedido";

      }

    };


  /*
  ============================================================
  TESTE DE CONEXÃO
  ============================================================
  */

  window.addEventListener(
    "online",
    () => {

      console.log(
        "🌐 Internet conectada."
      );

      document.getElementById(
        "statusFirebase"
      ).textContent =
        "🌐 Internet conectada";

    }
  );


  window.addEventListener(
    "offline",
    () => {

      console.log(
        "❌ Internet desconectada."
      );

      document.getElementById(
        "statusFirebase"
      ).textContent =
        "❌ Sem conexão com a internet";

    }
  );


  /*
  ============================================================
  INICIALIZAÇÃO
  ============================================================
  */

  mostrarProdutos();

  atualizarCarrinho();


  document.getElementById(
    "statusFirebase"
  ).textContent =
    "🔥 Sistema conectado ao Firebase";


  console.log(
    "✅ Cardápio carregado."
  );

  console.log(
    "🔥 Firestore configurado."
  );

</script>
