<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabor da Casa — Cardápio Digital</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f3f8;color:#222;padding-bottom:100px}
header{background:linear-gradient(135deg,#5b168f,#7b20b7);color:#fff;padding:25px 18px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.2)}
header h1{font-size:30px;margin-bottom:6px}
header p{font-size:16px;opacity:.95;margin-top:4px}
#logoRestaurante{max-height:75px;max-width:190px;object-fit:contain;margin-bottom:8px;display:none;border-radius:10px}
.container{max-width:900px;margin:auto;padding:18px}
.pesquisa{margin-bottom:10px}
.pesquisa input{width:100%;padding:14px 16px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-shadow:0 2px 7px rgba(0,0,0,.06)}
.categorias{display:flex;gap:8px;overflow-x:auto;padding:10px 0 18px}
.categoria{border:none;background:#fff;color:#5b168f;border-radius:25px;padding:11px 17px;font-size:14px;font-weight:bold;white-space:nowrap;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.12)}
.categoria.ativa{background:#6d1ca5;color:#fff}
.produto{background:#fff;border-radius:15px;margin-bottom:14px;padding:15px;box-shadow:0 2px 9px rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center;gap:14px}
.produto-info{flex:1;min-width:0}
.produto h3{color:#351047;margin-bottom:5px;font-size:19px}
.produto .descricao{color:#777;font-size:14px;margin-bottom:8px}
.preco{color:#6d1ca5;font-size:18px;font-weight:bold}
.preco-antigo{text-decoration:line-through;color:#999;font-size:13px;margin-right:6px}
.promocao{display:inline-block;background:#dc2626;color:#fff;padding:4px 7px;border-radius:7px;font-size:11px;font-weight:bold;margin-bottom:5px}
.produto-foto{width:88px;height:88px;border-radius:12px;object-fit:cover;flex:none}
.btn-adicionar{background:#731cac;color:#fff;border:none;border-radius:10px;padding:12px 15px;font-weight:bold;cursor:pointer;white-space:nowrap}
.btn-adicionar:active{transform:scale(.97)}
.barra-carrinho{position:fixed;bottom:0;left:0;right:0;background:#711aaa;color:#fff;padding:15px;z-index:100;box-shadow:0 -3px 12px rgba(0,0,0,.2);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.barra-carrinho strong{font-size:18px}
.modal-fundo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;padding:15px;overflow-y:auto}
.modal{background:#fff;max-width:620px;margin:25px auto;border-radius:18px;padding:20px}
.modal h2{color:#53117e;margin-bottom:15px}
.campo{margin-bottom:14px}
.campo label{display:block;font-weight:bold;margin-bottom:6px}
.campo input,.campo textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:16px}
.campo textarea{min-height:75px;resize:vertical}
.item-carrinho{border-bottom:1px solid #ddd;padding:14px 0}
.item-topo{display:flex;justify-content:space-between;gap:10px;font-weight:bold}
.item-controles{display:flex;align-items:center;gap:8px;margin-top:9px}
.item-controles button{border:none;background:#eee;border-radius:7px;width:34px;height:34px;font-size:18px;cursor:pointer}
.item-observacao{width:100%;margin-top:8px;padding:9px;border:1px solid #ddd;border-radius:7px}
.total{text-align:right;font-size:22px;font-weight:bold;color:#64169a;margin:18px 0}
.botoes-modal{display:flex;gap:10px}
.btn{flex:1;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-fechar{background:#ddd;color:#333}
.btn-enviar{background:#159447;color:#fff}
.btn-status{background:#eee;color:#53117e}
.vazio{text-align:center;color:#777;padding:30px 10px}
.aviso-carregamento{text-align:center;color:#777;padding:30px 10px}
.status-ultimo{display:none;margin:14px 0;background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 9px rgba(0,0,0,.1);cursor:pointer}
.status-ultimo strong{color:#53117e}
@media(max-width:600px){
header h1{font-size:25px}.produto{padding:13px}.produto h3{font-size:17px}.btn-adicionar{padding:10px;font-size:13px}.produto-foto{width:68px;height:68px}
}
</style>
</head>
<body>
<header>
<img id="logoRestaurante" alt="Logo">
<h1 id="nomeRestaurante">🍔 Sabor da Casa</h1>
<p id="subtituloRestaurante">Cardápio Digital</p>
<p id="localRestaurante">📍 Chapecó / Santa Catarina</p>
</header>

<div class="container">
<div id="statusUltimo" class="status-ultimo" onclick="abrirAcompanhamento()">
<strong>📋 Acompanhar pedido</strong>
<div id="resumoUltimoPedido" style="margin-top:5px"></div>
</div>

<div class="pesquisa">
<input id="campoPesquisa" type="search" placeholder="🔎 Procurar produto..." oninput="mostrarProdutos()">
</div>
<div class="categorias" id="areaCategorias"></div>
<div id="listaProdutos"><div class="aviso-carregamento">Carregando cardápio...</div></div>
</div>

<div class="barra-carrinho" onclick="abrirCarrinho()">
<strong>🛒 Carrinho</strong>
<strong id="totalBarra">R$ 0,00</strong>
</div>

<div class="modal-fundo" id="modalCarrinho">
<div class="modal">
<h2>🛒 Seu pedido</h2>
<div id="listaCarrinho"></div>
<div class="campo"><label>Número da mesa</label><input type="text" id="mesa" placeholder="Ex.: 5"></div>
<div class="campo"><label>Responsável pelo pedido</label><input type="text" id="responsavel" placeholder="Nome"></div>
<div class="campo"><label>Observação geral</label><textarea id="observacaoGeral" placeholder="Alguma observação para o pedido?"></textarea></div>
<div class="total">Total: <span id="totalModal">R$ 0,00</span></div>
<div class="botoes-modal">
<button class="btn btn-fechar" onclick="fecharCarrinho()">Fechar</button>
<button class="btn btn-enviar" id="btnEnviar" onclick="enviarPedido()">📲 Enviar pedido</button>
</div>
</div>
</div>

<div class="modal-fundo" id="modalAcompanhamento">
<div class="modal">
<h2>📋 Acompanhar pedido</h2>
<div style="text-align:center">
<div style="color:#777">Pedido</div>
<div id="numeroAcompanhamento" style="font-size:28px;font-weight:bold;color:#5b168f;margin:6px 0 18px"></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">
<div id="stRecebido" style="padding:12px;border-radius:10px;background:#eee">🔴<br><b>Recebido</b></div>
<div id="stPreparo" style="padding:12px;border-radius:10px;background:#eee">🟠<br><b>Em preparo</b></div>
<div id="stPronto" style="padding:12px;border-radius:10px;background:#eee">🔵<br><b>Pronto</b></div>
</div>
<div id="mensagemAcompanhamento" style="font-size:18px;font-weight:bold;color:#5b168f;margin:22px 0"></div>
<button class="btn btn-fechar" onclick="fecharAcompanhamento()">Fechar</button>
</div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{initializeFirestore,collection,addDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyArqDgHaf0l4yNNEAXeEBACMG4clfoHTfw",
authDomain:"sistema-digital-f9df1.firebaseapp.com",
projectId:"sistema-digital-f9df1",
storageBucket:"sistema-digital-f9df1.firebasestorage.app",
messagingSenderId:"783545984661",
appId:"1:783545984661:web:5d0945907ad9db3990dd9c"
};
const app=initializeApp(firebaseConfig);
const db=initializeFirestore(app,{},"default");

const produtosIniciais=[
{id:"x-bacon",nome:"X-Bacon",preco:26,categoria:"Lanches",descricao:"",ativo:true,promocaoAtiva:false},
{id:"x-salada",nome:"X-Salada",preco:23,categoria:"Lanches",descricao:"",ativo:true,promocaoAtiva:false},
{id:"x-calabresa",nome:"X-Calabresa",preco:27,categoria:"Lanches",descricao:"",ativo:true,promocaoAtiva:false},
{id:"x-tudo",nome:"X-Tudo",preco:34,categoria:"Lanches",descricao:"",ativo:true,promocaoAtiva:false},
{id:"pizza-calabresa",nome:"Pizza Calabresa",preco:45,categoria:"Pizzas",descricao:"",ativo:true,promocaoAtiva:false},
{id:"pizza-frango",nome:"Pizza Frango c/ Catupiry",preco:48,categoria:"Pizzas",descricao:"",ativo:true,promocaoAtiva:false},
{id:"pizza-mussarela",nome:"Pizza Mussarela",preco:40,categoria:"Pizzas",descricao:"",ativo:true,promocaoAtiva:false},
{id:"pizza-portuguesa",nome:"Pizza Portuguesa",preco:52,categoria:"Pizzas",descricao:"",ativo:true,promocaoAtiva:false},
{id:"batata-frita",nome:"Batata Frita",preco:20,categoria:"Porções",descricao:"",ativo:true,promocaoAtiva:false},
{id:"batata-queijo",nome:"Batata Frita c/ Queijo",preco:26,categoria:"Porções",descricao:"",ativo:true,promocaoAtiva:false},
{id:"tilapia",nome:"Porção de Tilápia",preco:38,categoria:"Porções",descricao:"",ativo:true,promocaoAtiva:false},
{id:"mandioca",nome:"Mandioca Frita",preco:18,categoria:"Porções",descricao:"",ativo:true,promocaoAtiva:false},
{id:"coca-cola",nome:"Coca-Cola",preco:7,categoria:"Bebidas",descricao:"",ativo:true,promocaoAtiva:false},
{id:"pepsi",nome:"Pepsi",preco:7,categoria:"Bebidas",descricao:"",ativo:true,promocaoAtiva:false},
{id:"cerveja",nome:"Cerveja",preco:13.5,categoria:"Bebidas",descricao:"",ativo:true,promocaoAtiva:false},
{id:"chopp",nome:"Chopp",preco:15,categoria:"Bebidas",descricao:"",ativo:true,promocaoAtiva:false}
];

let produtos=[];
let carrinho=[];
let categorias=[];
let categoriaAtual="Todos";
let configuracao={};
let ultimoPedido=null;

function dinheiro(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function precoAtual(p){return p.promocaoAtiva&&Number(p.precoPromocional)>0?Number(p.precoPromocional):Number(p.preco||0)}
function escapar(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function mostrarCategorias(){
const area=document.getElementById("areaCategorias");area.innerHTML="";
["Todos",...categorias.filter(c=>c!=="Todos")].forEach(cat=>{
const b=document.createElement("button");b.className="categoria"+(cat===categoriaAtual?" ativa":"");b.textContent=cat;
b.onclick=()=>{categoriaAtual=cat;mostrarCategorias();mostrarProdutos()};area.appendChild(b);
});
}

function mostrarProdutos(){
const busca=document.getElementById("campoPesquisa").value.trim().toLowerCase();
const lista=document.getElementById("listaProdutos");lista.innerHTML="";
const filtrados=produtos.filter(p=>p.ativo!==false&&(categoriaAtual==="Todos"||p.categoria===categoriaAtual)&&(!busca||`${p.nome} ${p.descricao||""} ${p.categoria||""}`.toLowerCase().includes(busca)));
if(!filtrados.length){lista.innerHTML='<div class="vazio">Nenhum produto encontrado.</div>';return}
filtrados.forEach(p=>{
const div=document.createElement("div");div.className="produto";
const promo=p.promocaoAtiva&&Number(p.precoPromocional)>0;
const foto=p.foto?`<img class="produto-foto" src="${escapar(p.foto)}" alt="">`:"";
div.innerHTML=`<div class="produto-info">${promo?'<div class="promocao">🔥 PROMOÇÃO</div>':""}<h3>${escapar(p.nome)}</h3><div class="descricao">${escapar(p.descricao||"")}</div><div class="preco">${promo?`<span class="preco-antigo">${dinheiro(p.preco)}</span>`:""}${dinheiro(precoAtual(p))}</div></div>${foto}<button class="btn-adicionar" onclick="adicionarProduto('${p.id}')">+ Adicionar</button>`;
lista.appendChild(div);
});
}

window.adicionarProduto=id=>{
const p=produtos.find(x=>x.id===id);if(!p)return;
const item=carrinho.find(x=>x.id===id);
if(item)item.quantidade++;else carrinho.push({id:p.id,nome:p.nome,preco:precoAtual(p),quantidade:1,observacao:""});
atualizarCarrinho();
};

window.alterarQuantidade=(id,q)=>{
const i=carrinho.find(x=>x.id===id);if(!i)return;
i.quantidade=Number(q);if(i.quantidade<=0)carrinho=carrinho.filter(x=>x.id!==id);atualizarCarrinho();
};
window.alterarObservacao=(id,v)=>{const i=carrinho.find(x=>x.id===id);if(i)i.observacao=v};
function total(){return carrinho.reduce((s,i)=>s+i.preco*i.quantidade,0)}

function atualizarCarrinho(){
document.getElementById("totalBarra").textContent=dinheiro(total());
const lista=document.getElementById("listaCarrinho");lista.innerHTML="";
if(!carrinho.length){lista.innerHTML='<div class="vazio">Seu carrinho está vazio.</div>';document.getElementById("totalModal").textContent=dinheiro(0);return}
carrinho.forEach(i=>{
const d=document.createElement("div");d.className="item-carrinho";
d.innerHTML=`<div class="item-topo"><span>${escapar(i.nome)}</span><span>${dinheiro(i.preco*i.quantidade)}</span></div><div class="item-controles"><button onclick="alterarQuantidade('${i.id}',${i.quantidade-1})">−</button><strong>${i.quantidade}</strong><button onclick="alterarQuantidade('${i.id}',${i.quantidade+1})">+</button></div><input class="item-observacao" value="${escapar(i.observacao||"")}" placeholder="Observação deste item" oninput="alterarObservacao('${i.id}',this.value)">`;
lista.appendChild(d);
});
document.getElementById("totalModal").textContent=dinheiro(total());
}

window.abrirCarrinho=()=>{atualizarCarrinho();document.getElementById("modalCarrinho").style.display="block"};
window.fecharCarrinho=()=>document.getElementById("modalCarrinho").style.display="none";

function aplicarConfiguracao(){
const nome=configuracao.nome||"Sabor da Casa";
document.getElementById("nomeRestaurante").textContent=`${configuracao.emoji||"🍔"} ${nome}`;
document.getElementById("subtituloRestaurante").textContent=configuracao.subtitulo||"Cardápio Digital";
document.getElementById("localRestaurante").textContent=`📍 ${configuracao.endereco||"Chapecó / Santa Catarina"}`;
const logo=document.getElementById("logoRestaurante");
if(configuracao.logo){logo.src=configuracao.logo;logo.style.display="inline-block"}else logo.style.display="none";
document.title=`${nome} — Cardápio Digital`;
}

function gerarNumeroPedido(){const d=new Date();return String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+String(d.getSeconds()).padStart(2,"0")}

window.enviarPedido=async()=>{
if(!carrinho.length){alert("🛒 Seu carrinho está vazio.");return}
const mesa=document.getElementById("mesa").value.trim();
const responsavel=document.getElementById("responsavel").value.trim();
const observacaoGeral=document.getElementById("observacaoGeral").value.trim();
if(!mesa){alert("⚠️ Informe o número da mesa.");return}
const btn=document.getElementById("btnEnviar");btn.disabled=true;btn.textContent="⏳ Registrando...";
try{
const numeroPedido=gerarNumeroPedido();
const itens=carrinho.map(i=>({id:i.id,nome:i.nome,preco:i.preco,quantidade:i.quantidade,observacao:i.observacao||""}));
const pedido={numeroPedido,mesa,responsavel,observacaoGeral,itens,total:total(),status:"Recebido",data:new Date().toISOString()};
await addDoc(collection(db,"pedidos"),pedido);
ultimoPedido={numeroPedido,status:"Recebido"};
localStorage.setItem("ultimoPedido",JSON.stringify(ultimoPedido));
mostrarStatusUltimo();
const telefone=(configuracao.telefone||"5549984121585").replace(/\D/g,"");
let msg=`*${configuracao.emoji||"🍔"} ${configuracao.nome||"SABOR DA CASA"}*%0A*Novo pedido #${numeroPedido}*%0A%0A📍 Mesa: ${mesa}%0A`;
if(responsavel)msg+=`👤 Responsável: ${responsavel}%0A`;
msg+="%0A*ITENS DO PEDIDO:*%0A";
itens.forEach(i=>{msg+=`${i.quantidade}x ${i.nome} - ${dinheiro(i.preco*i.quantidade)}%0A`;if(i.observacao)msg+=`   Obs.: ${i.observacao}%0A`});
if(observacaoGeral)msg+=`%0A📝 *Observação geral:*%0A${observacaoGeral}%0A`;
msg+=`%0A💰 *TOTAL: ${dinheiro(total())}*`;
if(telefone)window.open(`https://wa.me/${telefone}?text=${msg}`,"_blank");
carrinho=[];document.getElementById("mesa").value="";document.getElementById("responsavel").value="";document.getElementById("observacaoGeral").value="";
atualizarCarrinho();fecharCarrinho();
alert(`✅ Pedido registrado com sucesso!\n\nNúmero do pedido: #${numeroPedido}\n\nAgora você pode acompanhar o andamento do pedido.`);
abrirAcompanhamento();
}catch(e){console.error(e);alert("🔴 NÃO FOI POSSÍVEL REGISTRAR O PEDIDO.\n\n"+(e.message||e))}
finally{btn.disabled=false;btn.textContent="📲 Enviar pedido"}
};

function mostrarStatusUltimo(){
const el=document.getElementById("statusUltimo");
if(!ultimoPedido){el.style.display="none";return}
el.style.display="block";document.getElementById("resumoUltimoPedido").textContent=`#${ultimoPedido.numeroPedido} • ${ultimoPedido.status}`;
}
window.abrirAcompanhamento=()=>{
if(!ultimoPedido){alert("Ainda não há pedido para acompanhar.");return}
document.getElementById("modalAcompanhamento").style.display="block";renderAcompanhamento();
};
window.fecharAcompanhamento=()=>document.getElementById("modalAcompanhamento").style.display="none";

function renderAcompanhamento(){
if(!ultimoPedido)return;
document.getElementById("numeroAcompanhamento").textContent="#"+ultimoPedido.numeroPedido;
const s=ultimoPedido.status;
["stRecebido","stPreparo","stPronto"].forEach(id=>document.getElementById(id).style.background="#eee");
if(s==="Recebido"){document.getElementById("stRecebido").style.background="#d9b8ff";document.getElementById("mensagemAcompanhamento").textContent="🔴 Pedido recebido! O restaurante já recebeu seu pedido."}
else if(s==="Em preparo"){document.getElementById("stRecebido").style.background="#bde8c8";document.getElementById("stPreparo").style.background="#d9b8ff";document.getElementById("mensagemAcompanhamento").textContent="🟠 Seu pedido está em preparo!"}
else if(s==="Pronto"||s==="Finalizado"){document.getElementById("stRecebido").style.background="#bde8c8";document.getElementById("stPreparo").style.background="#bde8c8";document.getElementById("stPronto").style.background="#bde8c8";document.getElementById("mensagemAcompanhamento").textContent="🔵 Seu pedido está pronto! Aguarde para receber seu pedido."}
}

try{
const salvo=JSON.parse(localStorage.getItem("ultimoPedido")||"null");if(salvo)ultimoPedido=salvo;mostrarStatusUltimo();
}catch(e){}

onSnapshot(collection(db,"produtos"),snap=>{
produtos=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.ativo!==false);
if(!produtos.length)produtos=produtosIniciais;
categorias=[...new Set(produtos.map(p=>p.categoria).filter(Boolean))];
mostrarCategorias();mostrarProdutos();
},err=>{
console.warn("Produtos do Firebase indisponíveis:",err);
produtos=produtosIniciais;categorias=[...new Set(produtos.map(p=>p.categoria))];mostrarCategorias();mostrarProdutos();
});

onSnapshot(collection(db,"configuracaoRestaurante"),snap=>{
configuracao={};
snap.forEach(d=>configuracao={...d.data()});
aplicarConfiguracao();
},err=>console.warn("Configuração indisponível:",err));

if(ultimoPedido){
onSnapshot(collection(db,"pedidos"),snap=>{
const p=snap.docs.map(d=>({id:d.id,...d.data()})).find(x=>String(x.numeroPedido)===String(ultimoPedido.numeroPedido));
if(p){ultimoPedido={numeroPedido:p.numeroPedido,status:p.status};localStorage.setItem("ultimoPedido",JSON.stringify(ultimoPedido));mostrarStatusUltimo();if(document.getElementById("modalAcompanhamento").style.display==="block")renderAcompanhamento()}
});
}
atualizarCarrinho();
</script>
</body>
</html>
