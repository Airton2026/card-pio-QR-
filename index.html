<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sabor da Casa — Cardápio Digital</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3f8;
      color: #222;
      padding-bottom: 100px;
    }

    header {
      background: linear-gradient(135deg, #5b168f, #7b20b7);
      color: white;
      padding: 25px 18px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.2);
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 16px;
      opacity: .95;
      margin-top: 4px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .categorias {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0 18px;
    }

    .categoria {
      border: none;
      background: white;
      color: #5b168f;
      border-radius: 25px;
      padding: 11px 17px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 7px rgba(0,0,0,.12);
    }

    .categoria.ativa {
      background: #6d1ca5;
      color: white;
    }

    .produto {
      background: white;
      border-radius: 15px;
      margin-bottom: 14px;
      padding: 17px;
      box-shadow: 0 2px 9px rgba(0,0,0,.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .produto-info {
      flex: 1;
    }

    .produto h3 {
      color: #351047;
      margin-bottom: 5px;
      font-size: 19px;
    }

    .produto .descricao {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .preco {
      color: #6d1ca5;
      font-size: 18px;
      font-weight: bold;
    }

    .btn-adicionar {
      background: #731cac;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-adicionar:active {
      transform: scale(.97);
    }

    .teste-firebase {
      width: 100%;
      border: none;
      background: #741bae;
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .barra-carrinho {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #711aaa;
      color: white;
      padding: 15px;
      z-index: 100;
      box-shadow: 0 -3px 12px rgba(0,0,0,.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .barra-carrinho strong {
      font-size: 18px;
    }

    .modal-fundo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 200;
      padding: 15px;
      overflow-y: auto;
    }

    .modal {
      background: white;
      max-width: 600px;
      margin: 30px auto;
      border-radius: 18px;
      padding: 20px;
    }

    .modal h2 {
      color: #53117e;
      margin-bottom: 15px;
    }

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo input,
    .campo textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    .campo textarea {
      min-height: 75px;
      resize: vertical;
    }

    .item-carrinho {
      border-bottom: 1px solid #ddd;
      padding: 14px 0;
    }

    .item-topo {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: bold;
    }

    .item-controles {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
    }

    .item-controles button {
      border: none;
      background: #eee;
      border-radius: 7px;
      width: 32px;
      height: 32px;
      font-size: 18px;
      cursor: pointer;
    }

    .item-observacao {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      border: 1px solid #ddd;
      border-radius: 7px;
    }

    .total {
      text-align: right;
      font-size: 22px;
      font-weight: bold;
      color: #64169a;
      margin: 18px 0;
    }

    .botoes-modal {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-fechar {
      background: #ddd;
      color: #333;
    }

    .btn-enviar {
      background: #159447;
      color: white;
    }

    .vazio {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      .produto {
        padding: 14px;
      }

      .produto h3 {
        font-size: 17px;
      }

      .btn-adicionar {
        padding: 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍔 Sabor da Casa</h1>
  <p>Cardápio Digital</p>
  <p>📍 Chapecó / Santa Catarina</p>
</header>

<div class="container">

  <div class="categorias">
    <button class="categoria ativa" onclick="filtrar('Todos', this)">Todos</button>
    <button class="categoria" onclick="filtrar('Lanches', this)">Lanches</button>
    <button class="categoria" onclick="filtrar('Pizzas', this)">Pizzas</button>
    <button class="categoria" onclick="filtrar('Porções', this)">Porções</button>
    <button class="categoria" onclick="filtrar('Bebidas', this)">Bebidas</button>
  </div>

  <div id="listaProdutos"></div>

  <button class="teste-firebase" onclick="testarFirebase()">
    🔴 TESTAR FIREBASE
  </button>

</div>

<div class="barra-carrinho" onclick="abrirCarrinho()">
  <strong>🛒 Carrinho</strong>
  <strong id="totalBarra">R$ 0,00</strong>
</div>

<!-- MODAL DO CARRINHO -->
<div class="modal-fundo" id="modalCarrinho">

  <div class="modal">

    <h2>🛒 Seu pedido</h2>

    <div id="listaCarrinho"></div>

    <div class="campo">
      <label>Número da mesa</label>
      <input
        type="text"
        id="mesa"
        placeholder="Ex.: 5">
    </div>

    <div class="campo">
      <label>Responsável pelo pedido</label>
      <input
        type="text"
        id="responsavel"
        placeholder="Nome">
    </div>

    <div class="campo">
      <label>Observação geral</label>
      <textarea
        id="observacaoGeral"
        placeholder="Alguma observação para o pedido?"></textarea>
    </div>

    <div class="total">
      Total: <span id="totalModal">R$ 0,00</span>
    </div>

    <div class="botoes-modal">
      <button class="btn btn-fechar" onclick="fecharCarrinho()">
        Fechar
      </button>

      <button class="btn btn-enviar" id="btnEnviar" onclick="enviarPedido()">
        📲 Enviar pedido
      </button>
    </div>

  </div>

</div>

<script type="module">

  /*
  ==========================================================
  FIREBASE
  ==========================================================
  */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-lite.js";


  const firebaseConfig = {
    apiKey: "AIzaSyArqDgHaf0l4yNNEAXeEBACMG4clfoHTfw",
    authDomain: "sistema-digital-f9df1.firebaseapp.com",
    projectId: "sistema-digital-f9df1",
    storageBucket: "sistema-digital-f9df1.firebasestorage.app",
    messagingSenderId: "783545984661",
    appId: "1:783545984661:web:5d0945907ad9db3990dd9c"
  };


  const app = initializeApp(firebaseConfig);

  /*
  IMPORTANTE:
  estamos informando explicitamente o banco "default"
  */

  const db = getFirestore(app, "default");


  /*
  ==========================================================
  PRODUTOS
  ==========================================================
  */

  const produtos = [

    {
      id: 1,
      nome: "X-Bacon",
      descricao: "Lanche",
      preco: 26,
      categoria: "Lanches"
    },

    {
      id: 2,

      preco: 23,

    },

    {
      id: 3,

      descricao: "Lanche",
      preco: 27,
      categoria: "Lanches"
    },

    {
      id: 4,
      nome: "X-Tudo",
      descricao: "Lanche completo",
      preco: 34,
      categoria: "Lanches"
    },

    {
      id: 5,
      nome: "Pizza Calabresa",
      descricao: "Pizza",
      preco: 45,
      categoria: "Pizzas"
    },

    {
      id: 6,
      nome: "Pizza Frango c/ Catupiry",
      descricao: "Pizza",
      preco: 48,

    },

    {

      descricao: "Pizza",

    },

    {
      id: 8,
      nome: "Pizza Portuguesa",
      descricao: "Pizza",

    },

    {
      id: 9,
      nome: "Batata Frita",
      descricao: "Porção",
      preco: 20,
      categoria: "Porções"
    },

    {
      id: 10,
      nome: "Batata Frita c/ Queijo",
      descricao: "Porção",
      preco: 26,
      categoria: "Porções"
    },

    {
      id: 11,
      nome: "Porção de Tilápia",
      descricao: "Porção",
      preco: 38,
      categoria: "Porções"
    },

    {
      id: 12,
      nome: "Mandioca Frita",
      descricao: "Porção",
      preco: 18,
      categoria: "Porções"
    },

    {
      id: 13,
      nome: "Coca-Cola",
      descricao: "Refrigerante",
      preco: 7,
      categoria: "Bebidas"
    },

    {
      id: 14,
      nome: "Pepsi",
      descricao: "Refrigerante",
      preco: 7,
      categoria: "Bebidas"
    },

    {
      id: 15,
      nome: "Cerveja",
      descricao: "Cerveja",
      preco: 13,
      categoria: "Bebidas"
    },

    {
      id: 16,
      nome: "Chopp",
      descricao: "Chopp",
      preco: 15,
      categoria: "Bebidas"
    }

  ];


  /*
  ==========================================================
  CARRINHO
  ==========================================================
  */

  let carrinho = [];


  /*
  ==========================================================
  FORMATAR DINHEIRO
  ==========================================================
  */

  function dinheiro(valor) {

    return valor.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

  }


  /*
  ==========================================================
  MOSTRAR PRODUTOS
  ==========================================================
  */

  function mostrarProdutos(categoria = "Todos") {

    const lista = document.getElementById("listaProdutos");

    lista.innerHTML = "";

    const produtosFiltrados =
      categoria === "Todos"
        ? produtos
        : produtos.filter(
            produto => produto.categoria === categoria
          );


    if (produtosFiltrados.length === 0) {

      lista.innerHTML = `
        <div class="vazio">
          Nenhum produto encontrado.
        </div>
      `;

      return;
    }


    produtosFiltrados.forEach(produto => {

      const div = document.createElement("div");

      div.className = "produto";

      div.innerHTML = `

        <div class="produto-info">

          <h3>${produto.nome}</h3>

          <div class="descricao">
            ${produto.descricao}
          </div>

          <div class="preco">
            ${dinheiro(produto.preco)}
          </div>

        </div>

        <button
          class="btn-adicionar"
          onclick="adicionarProduto(${produto.id})">

          + Adicionar

        </button>

      `;

      lista.appendChild(div);

    });

  }


  /*
  ==========================================================
  FILTRO
  ==========================================================
  */

  window.filtrar = function(categoria, botao) {

    document
      .querySelectorAll(".categoria")
      .forEach(btn => btn.classList.remove("ativa"));

    botao.classList.add("ativa");

    mostrarProdutos(categoria);

  };


  /*
  ==========================================================
  ADICIONAR PRODUTO
  ==========================================================
  */

  window.adicionarProduto = function(id) {

    const produto =
      produtos.find(p => p.id === id);

    if (!produto) return;


    const existente =
      carrinho.find(item => item.id === id);


    if (existente) {

      existente.quantidade++;

    } else {

      carrinho.push({

        id: produto.id,

        nome: produto.nome,

        preco: produto.preco,

        quantidade: 1,

        observacao: ""

      });

    }


    atualizarCarrinho();

  };


  /*
  ==========================================================
  ALTERAR QUANTIDADE
  ==========================================================
  */

  window.alterarQuantidade = function(id, quantidade) {

    const item =
      carrinho.find(item => item.id === id);

    if (!item) return;


    item.quantidade = quantidade;


    if (item.quantidade <= 0) {

      carrinho =
        carrinho.filter(item => item.id !== id);

    }


    atualizarCarrinho();

  };


  /*
  ==========================================================
  OBSERVAÇÃO DO ITEM
  ==========================================================
  */

  window.alterarObservacao = function(id, valor) {

    const item =
      carrinho.find(item => item.id === id);

    if (!item) return;

    item.observacao = valor;

  };


  /*
  ==========================================================
  CALCULAR TOTAL
  ==========================================================
  */

  function calcularTotal() {

    return carrinho.reduce(
      (total, item) =>
        total + item.preco * item.quantidade,
      0
    );

  }


  /*
  ==========================================================
  ATUALIZAR CARRINHO
  ==========================================================
  */

  function atualizarCarrinho() {

    const total =
      calcularTotal();


    document.getElementById("totalBarra")
      .textContent = dinheiro(total);


    const lista =
      document.getElementById("listaCarrinho");


    lista.innerHTML = "";


    if (carrinho.length === 0) {

      lista.innerHTML = `
        <div class="vazio">
          Seu carrinho está vazio.
        </div>
      `;

      document.getElementById("totalModal")
        .textContent = dinheiro(0);

      return;

    }


    carrinho.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "item-carrinho";


      div.innerHTML = `

        <div class="item-topo">

          <span>
            ${item.nome}
          </span>

          <span>
            ${dinheiro(item.preco * item.quantidade)}
          </span>

        </div>


        <div class="item-controles">

          <button
            onclick="alterarQuantidade(${item.id}, ${item.quantidade - 1})">
            −
          </button>

          <strong>
            ${item.quantidade}
          </strong>

          <button
            onclick="alterarQuantidade(${item.id}, ${item.quantidade + 1})">
            +
          </button>

        </div>


        <input
          class="item-observacao"
          type="text"
          placeholder="Observação deste item"
          value="${item.observacao || ""}"
          oninput="alterarObservacao(${item.id}, this.value)"
        >

      `;


      lista.appendChild(div);

    });


    document.getElementById("totalModal")
      .textContent = dinheiro(total);

  }


  /*
  ==========================================================
  ABRIR CARRINHO
  ==========================================================
  */

  window.abrirCarrinho = function() {

    atualizarCarrinho();

    document.getElementById("modalCarrinho")
      .style.display = "block";

  };


  /*
  ==========================================================
  FECHAR CARRINHO
  ==========================================================
  */

  window.fecharCarrinho = function() {

    document.getElementById("modalCarrinho")
      .style.display = "none";

  };


  /*
  ==========================================================
  TESTAR FIREBASE
  ==========================================================
  */

  window.testarFirebase = async function() {

    alert(
      "🔄 TESTANDO FIREBASE LITE...\n\n" +
      "Primeiro vamos testar a leitura."
    );


    try {

      const ref =
        collection(db, "pedidos");


      const resultado =
        await getDocs(ref);


      alert(
        "🟢 LEITURA FUNCIONOU!\n\n" +

        "Documentos encontrados: " +
        resultado.size +

        "\n\nAgora vamos testar a gravação."
      );


      const teste = {

        teste: true,

        mensagem:
          "TESTE FIREBASE LITE",

        data:
          new Date().toISOString()

      };


      const novoDocumento =
        await addDoc(ref, teste);


      alert(

        "🟢 FIREBASE LITE FUNCIONOU!\n\n" +

        "Leitura: OK\n" +

        "Gravação: OK\n\n" +

        "ID do teste:\n" +

        novoDocumento.id

      );


    } catch (erro) {

      console.error(erro);


      alert(

        "🔴 ERRO NO FIREBASE LITE\n\n" +

        "Código:\n" +

        (erro.code || "não informado") +

        "\n\nMensagem:\n" +

        (erro.message || erro)

      );

    }

  };


  /*
  ==========================================================
  GERAR NÚMERO DO PEDIDO
  ==========================================================
  */

  function gerarNumeroPedido() {

    const agora = new Date();

    const hora =
      String(agora.getHours()).padStart(2, "0");

    const minuto =
      String(agora.getMinutes()).padStart(2, "0");

    const segundo =
      String(agora.getSeconds()).padStart(2, "0");


    return hora + minuto + segundo;

  }


  /*
  ==========================================================
  SALVAR PEDIDO NO FIREBASE
  ==========================================================
  */

  async function salvarPedidoNoSistema(pedidoSistema) {

    const ref =
      collection(db, "pedidos");


    const resultado =
      await addDoc(ref, pedidoSistema);


    return resultado;

  }


  /*
  ==========================================================
  ENVIAR PEDIDO
  ==========================================================
  */

  window.enviarPedido = async function() {

    if (carrinho.length === 0) {

      alert(
        "🛒 Seu carrinho está vazio."
      );

      return;

    }


    const mesa =
      document.getElementById("mesa")
        .value.trim();


    const responsavel =
      document.getElementById("responsavel")
        .value.trim();


    const observacaoGeral =
      document.getElementById("observacaoGeral")
        .value.trim();


    if (!mesa) {

      alert(
        "⚠️ Informe o número da mesa."
      );

      return;

    }


    const btn =
      document.getElementById("btnEnviar");


    btn.disabled = true;

    btn.textContent =
      "⏳ Registrando...";


    try {

      const numeroPedido =
        gerarNumeroPedido();


      const itensPedido =
        carrinho.map(item => ({

          id: item.id,

          nome: item.nome,

          preco: item.preco,

          quantidade: item.quantidade,

          observacao:
            item.observacao || ""

        }));


      const pedidoSistema = {

        numeroPedido:

          numeroPedido,

        mesa:

          mesa,

        responsavel:

          responsavel,

        observacaoGeral:

          observacaoGeral,

        itens:

          itensPedido,

        total:

          calcularTotal(),

        status:

          "Recebido",

        data:

          new Date().toISOString()

      };


      /*
      ======================================================
      PRIMEIRO SALVA NO FIREBASE
      ======================================================
      */

      await salvarPedidoNoSistema(
        pedidoSistema
      );


      /*
      ======================================================
      DEPOIS ABRE O WHATSAPP
      ======================================================
      */

      let mensagem = "";

      mensagem +=
        "*🍔 SABOR DA CASA*\n";

      mensagem +=
        "*Novo pedido #" +
        numeroPedido +
        "*\n\n";


      mensagem +=
        "📍 Mesa: " +
        mesa +
        "\n";


      if (responsavel) {

        mensagem +=
          "👤 Responsável: " +
          responsavel +
          "\n";

      }


      mensagem += "\n";


      mensagem +=
        "*ITENS DO PEDIDO:*\n";


      carrinho.forEach(item => {

        mensagem +=
          item.quantidade +
          "x " +
          item.nome +
          " - " +
          dinheiro(
            item.preco *
            item.quantidade
          ) +
          "\n";


        if (item.observacao) {

          mensagem +=
            "   Obs.: " +
            item.observacao +
            "\n";

        }

      });


      if (observacaoGeral) {

        mensagem +=
          "\n📝 *Observação geral:*\n" +
          observacaoGeral +
          "\n";

      }


      mensagem +=
        "\n💰 *TOTAL: " +
        dinheiro(calcularTotal()) +
        "*";


      const telefone =
        "5549984121585";


      const url =
        "https://wa.me/" +
        telefone +
        "?text=" +
        encodeURIComponent(mensagem);


      window.open(
        url,
        "_blank"
      );


      /*
      ======================================================
      LIMPAR CARRINHO
      ======================================================
      */

      carrinho = [];


      document.getElementById("mesa")
        .value = "";

      document.getElementById("responsavel")
        .value = "";

      document.getElementById("observacaoGeral")
        .value = "";


      atualizarCarrinho();

      fecharCarrinho();


      alert(
        "✅ Pedido registrado com sucesso!\n\n" +
        "Número do pedido: #" +
        numeroPedido
      );


    } catch (erro) {

      console.error(
        "Erro ao registrar pedido:",
        erro
      );


      alert(

        "🔴 NÃO FOI POSSÍVEL REGISTRAR O PEDIDO.\n\n" +

        "Código:\n" +

        (erro.code ||
          "não informado") +

        "\n\nMensagem:\n" +

        (erro.message ||
          erro)

      );


    } finally {

      btn.disabled = false;

      btn.textContent =
        "📲 Enviar pedido";

    }

  };


  /*
  ==========================================================
  INICIAR
  ==========================================================
  */

  mostrarProdutos();

  atualizarCarrinho();

</script>

</body>
</html>
