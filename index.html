<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sabor da Casa — Cardápio Digital</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #b0003a;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      padding-bottom: 120px;
    }

    .categorias {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 15px;
    }

    .categoria {
      border: none;
      background: white;
      border-radius: 20px;
      padding: 10px 16px;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
    }

    .categoria:hover {
      background: #ffe5ee;
    }

    h2 {
      margin-top: 20px;
    }

    .produto {
      background: white;
      margin: 12px 0;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .produto-info {
      flex: 1;
    }

    .produto h3 {
      margin: 0 0 6px;
    }

    .produto p {
      margin: 5px 0;
      color: #666;
    }

    .preco {
      color: #b0003a;
      font-size: 18px;
      font-weight: bold;
    }

    .btn {
      border: none;
      background: #b0003a;
      color: white;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn-secundario {
      background: #555;
    }

    .carrinho {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 850px;
      background: #b0003a;
      color: white;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.25);
      z-index: 100;
    }

    .carrinho button {
      border: none;
      background: white;
      color: #b0003a;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-fundo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 200;
      padding: 20px;
      overflow-y: auto;
    }

    .modal {
      background: white;
      max-width: 600px;
      margin: 30px auto;
      border-radius: 15px;
      padding: 22px;
    }

    .modal h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .item-carrinho {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .item-topo {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .quantidade {
      font-weight: bold;
      color: #b0003a;
    }

    .observacao-item {
      margin-top: 8px;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      color: #b0003a;
      text-align: right;
      margin: 20px 0;
    }

    .acoes {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .teste-firebase {
      margin-top: 25px;
      width: 100%;
      background: #b0003a;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .vazio {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .produto {
        align-items: flex-start;
      }

      .produto .btn {
        padding: 10px 12px;
      }

      .carrinho {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍽️ Sabor da Casa</h1>
  <p>Cardápio Digital</p>
</header>

<div class="container">

  <div class="categorias">
    <button class="categoria" onclick="filtrar('Todos')">Todos</button>
    <button class="categoria" onclick="filtrar('Lanches')">🍔 Lanches</button>
    <button class="categoria" onclick="filtrar('Pizzas')">🍕 Pizzas</button>
    <button class="categoria" onclick="filtrar('Porções')">🍟 Porções</button>
    <button class="categoria" onclick="filtrar('Bebidas')">🥤 Bebidas</button>
  </div>

  <h2>Nosso Cardápio</h2>

  <div id="listaProdutos"></div>

  <button class="teste-firebase" onclick="testarFirebase()">
    🔴 TESTAR FIREBASE
  </button>

</div>

<div class="carrinho">

  <span>
    🛒 Carrinho:
    <strong id="quantidadeCarrinho">0</strong>
  </span>

  <span>
    R$ <strong id="totalCarrinho">0,00</strong>
  </span>

  <button onclick="abrirPedido()">
    Ver pedido
  </button>

</div>

<div class="modal-fundo" id="modalPedido">

  <div class="modal">

    <h2>🛒 Seu Pedido</h2>

    <div id="itensPedido"></div>

    <div class="total">
      Total: R$ <span id="totalModal">0,00</span>
    </div>

    <label>
      Mesa
      <input
        type="text"
        id="mesa"
        placeholder="Ex.: 5"
      >
    </label>

    <label>
      Responsável pelo pedido
      <input
        type="text"
        id="responsavel"
        placeholder="Nome"
      >
    </label>

    <label>
      Observação geral
      <textarea
        id="observacaoGeral"
        placeholder="Alguma observação?"
      ></textarea>
    </label>

    <div class="acoes">

      <button
        class="btn btn-secundario"
        onclick="fecharPedido()">
        Fechar
      </button>

      <button
        class="btn"
        id="btnEnviar"
        onclick="enviarPedido()">
        📲 Enviar Pedido
      </button>

    </div>

  </div>

</div>


<script type="module">

  /* =====================================================
     FIREBASE
  ====================================================== */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyArqDgHaf0l4yNNEAXeEBACMG4clfoHTfw",

    authDomain: "sistema-digital-f9df1.firebaseapp.com",

    projectId: "sistema-digital-f9df1",

    storageBucket: "sistema-digital-f9df1.firebasestorage.app",

    messagingSenderId: "783545984661",

    appId: "1:783545984661:web:5d0945907ad9db3990dd9c"

  };


  const app = initializeApp(firebaseConfig);

  /*
     IMPORTANTE:
     Agora estamos usando o Firestore no modo normal.
     Retiramos experimentalForceLongPolling.
  */

  const db = getFirestore(app);


  /* =====================================================

  ====================================================== */

  const produtos = [

    {

    },

    },

    {

    },

    {

    },

    {

    },

    {

    },

    {
      id: 9,

      descricao: "Porção de batata frita",
      preco: 20,
      categoria: "Porções"
    },

    {
      id: 10,

      descricao: "Batata frita com queijo",
      preco: 26,
      categoria: "Porções"
    },

    {
      id: 11,
      nome: "Porção de Tilápia",
      descricao: "Tilápia frita",
      preco: 38,
      categoria: "Porções"
    },

    {
      id: 12,
      nome: "Mandioca Frita",
      descricao: "Porção de mandioca frita",
      preco: 18,
      categoria: "Porções"
    },

    {
      id: 13,
      nome: "Coca-Cola",
      descricao: "Refrigerante",
      preco: 7,
      categoria: "Bebidas"
    },

    {
      id: 14,
      nome: "Pepsi",
      descricao: "Refrigerante",
      preco: 7,
      categoria: "Bebidas"
    },

    {
      id: 15,
      nome: "Cerveja",
      descricao: "Cerveja",
      preco: 13,
      categoria: "Bebidas"
    },

    {
      id: 16,
      nome: "Chopp",
      descricao: "Chopp",
      preco: 15,
      categoria: "Bebidas"
    }

  ];


  /* =====================================================
     CARRINHO
  ====================================================== */

  let carrinho = [];


  /* =====================================================
     FORMATAÇÃO DE PREÇO
  ====================================================== */

  function dinheiro(valor) {

    return valor.toLocaleString("pt-BR", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  }


  /* =====================================================
     MOSTRAR PRODUTOS
  ====================================================== */

  function mostrarProdutos(lista) {

    const container =
      document.getElementById("listaProdutos");

    container.innerHTML = "";


    if (lista.length === 0) {

      container.innerHTML = `
        <div class="vazio">
          Nenhum produto encontrado.
        </div>
      `;

      return;
    }


    lista.forEach(produto => {

      const div = document.createElement("div");

      div.className = "produto";


      div.innerHTML = `

        <div class="produto-info">

          <h3>${produto.nome}</h3>

          <p>${produto.descricao}</p>

          <div class="preco">
            R$ ${dinheiro(produto.preco)}
          </div>

        </div>

        <button
          class="btn"
          onclick="adicionarProduto(${produto.id})">

          + Adicionar

        </button>

      `;


      container.appendChild(div);

    });

  }


  /* =====================================================
     FILTRO
  ====================================================== */

  window.filtrar = function(categoria) {

    if (categoria === "Todos") {

      mostrarProdutos(produtos);

      return;

    }


    const filtrados =
      produtos.filter(
        produto => produto.categoria === categoria
      );


    mostrarProdutos(filtrados);

  };


  /* =====================================================
     ADICIONAR PRODUTO
  ====================================================== */

  window.adicionarProduto = function(id) {

    const produto =
      produtos.find(p => p.id === id);


    if (!produto) return;


    const existente =
      carrinho.find(item => item.id === id);


    if (existente) {

      existente.quantidade++;

    } else {

      carrinho.push({

        id: produto.id,

        nome: produto.nome,

        preco: produto.preco,

        quantidade: 1,

        observacao: ""

      });

    }


    atualizarCarrinho();

  };


  /* =====================================================
     ATUALIZAR CARRINHO
  ====================================================== */

  function atualizarCarrinho() {

    let quantidade = 0;

    let total = 0;


    carrinho.forEach(item => {

      quantidade += item.quantidade;

      total +=
        item.preco * item.quantidade;

    });


    document.getElementById(
      "quantidadeCarrinho"
    ).textContent = quantidade;


    document.getElementById(
      "totalCarrinho"
    ).textContent = dinheiro(total);

  }


  /* =====================================================
     ABRIR PEDIDO
  ====================================================== */

  window.abrirPedido = function() {

    if (carrinho.length === 0) {

      alert("🛒 Seu carrinho está vazio.");

      return;

    }


    renderizarPedido();


    document.getElementById(
      "modalPedido"
    ).style.display = "block";

  };


  /* =====================================================
     FECHAR PEDIDO
  ====================================================== */

  window.fecharPedido = function() {

    document.getElementById(
      "modalPedido"
    ).style.display = "none";

  };


  /* =====================================================
     RENDERIZAR PEDIDO
  ====================================================== */

  function renderizarPedido() {

    const container =
      document.getElementById("itensPedido");


    container.innerHTML = "";


    carrinho.forEach((item, index) => {

      const div =
        document.createElement("div");


      div.className = "item-carrinho";


      div.innerHTML = `

        <div class="item-topo">

          <div>

            <strong>
              ${item.nome}
            </strong>

            <div class="quantidade">
              Quantidade: ${item.quantidade}
            </div>

          </div>

          <strong>
            R$ ${dinheiro(
              item.preco * item.quantidade
            )}
          </strong>

        </div>


        <div class="acoes" style="margin-top:8px;">

          <button
            class="btn"
            onclick="aumentarItem(${index})">
            +
          </button>

          <button
            class="btn btn-secundario"
            onclick="diminuirItem(${index})">
            -
          </button>

          <button
            class="btn btn-secundario"
            onclick="removerItem(${index})">
            🗑️
          </button>

        </div>


        <div class="observacao-item">

          <input
            type="text"
            placeholder="Observação deste item"
            value="${item.observacao || ""}"
            onchange="alterarObservacao(${index}, this.value)"
          >

        </div>

      `;


      container.appendChild(div);

    });


    let total = 0;


    carrinho.forEach(item => {

      total +=
        item.preco * item.quantidade;

    });


    document.getElementById(
      "totalModal"
    ).textContent = dinheiro(total);

  }


  /* =====================================================
     AUMENTAR ITEM
  ====================================================== */

  window.aumentarItem = function(index) {

    carrinho[index].quantidade++;

    renderizarPedido();

    atualizarCarrinho();

  };


  /* =====================================================
     DIMINUIR ITEM
  ====================================================== */

  window.diminuirItem = function(index) {

    if (carrinho[index].quantidade > 1) {

      carrinho[index].quantidade--;

    } else {

      carrinho.splice(index, 1);

    }


    if (carrinho.length === 0) {

      fecharPedido();

    } else {

      renderizarPedido();

    }


    atualizarCarrinho();

  };


  /* =====================================================
     REMOVER ITEM
  ====================================================== */

  window.removerItem = function(index) {

    carrinho.splice(index, 1);


    if (carrinho.length === 0) {

      fecharPedido();

    } else {

      renderizarPedido();

    }


    atualizarCarrinho();

  };


  /* =====================================================
     OBSERVAÇÃO DO ITEM
  ====================================================== */

  window.alterarObservacao =
    function(index, valor) {

      carrinho[index].observacao = valor;

    };


  /* =====================================================
     GERAR NÚMERO DO PEDIDO
  ====================================================== */

  function gerarNumeroPedido() {

    const agora = new Date();

    const ano =
      agora.getFullYear();

    const mes =
      String(
        agora.getMonth() + 1
      ).padStart(2, "0");

    const dia =
      String(
        agora.getDate()
      ).padStart(2, "0");

    const hora =
      String(
        agora.getHours()
      ).padStart(2, "0");

    const minuto =
      String(
        agora.getMinutes()
      ).padStart(2, "0");

    const segundo =
      String(
        agora.getSeconds()
      ).padStart(2, "0");


    return `${ano}${mes}${dia}${hora}${minuto}${segundo}`;

  }


  /* =====================================================
     SALVAR PEDIDO NO FIREBASE
  ====================================================== */

  async function salvarPedidoNoSistema() {

    const mesa =
      document.getElementById("mesa").value.trim();

    const responsavel =
      document.getElementById("responsavel").value.trim();

    const observacaoGeral =
      document.getElementById(
        "observacaoGeral"
      ).value.trim();


    let total = 0;


    carrinho.forEach(item => {

      total +=
        item.preco * item.quantidade;

    });


    const pedidoSistema = {

      numeroPedido:
        gerarNumeroPedido(),

      mesa: mesa,

      responsavel: responsavel,

      observacaoGeral:
        observacaoGeral,

      itens: carrinho.map(item => ({

        id: item.id,

        nome: item.nome,

        preco: item.preco,

        quantidade: item.quantidade,

        observacao:
          item.observacao || ""

      })),

      total: total,

      status: "Recebido",

      data: new Date().toISOString()

    };


    /*
       Aqui acontece a gravação direta
       na coleção "pedidos".
    */

    const ref =
      collection(db, "pedidos");


    const resultado =
      await addDoc(
        ref,
        pedidoSistema
      );


    return {

      ...pedidoSistema,

      idFirebase:
        resultado.id

    };

  }


  /* =====================================================
     ENVIAR PEDIDO
  ====================================================== */

  window.enviarPedido = async function() {

    if (carrinho.length === 0) {

      alert("🛒 O carrinho está vazio.");

      return;

    }


    const mesa =
      document.getElementById("mesa").value.trim();


    const responsavel =
      document.getElementById(
        "responsavel"
      ).value.trim();


    if (!mesa) {

      alert("Informe o número da mesa.");

      return;

    }


    if (!responsavel) {

      alert("Informe o responsável pelo pedido.");

      return;

    }


    const botao =
      document.getElementById("btnEnviar");


    botao.disabled = true;

    botao.textContent =
      "⏳ Registrando...";


    try {

      /*
         PRIMEIRO:
         salva no Firebase.
      */

      const pedido =
        await salvarPedidoNoSistema();


      /*
         DEPOIS:
         abre o WhatsApp.
      */

      let mensagem =
        `🍽️ *NOVO PEDIDO - SABOR DA CASA*\n\n`;


      mensagem +=
        `📋 Pedido: ${pedido.numeroPedido}\n`;

      mensagem +=
        `🪑 Mesa: ${pedido.mesa}\n`;

      mensagem +=
        `👤 Responsável: ${pedido.responsavel}\n\n`;


      mensagem +=
        `*ITENS:*\n`;


      pedido.itens.forEach(item => {

        mensagem +=
          `${item.quantidade}x ${item.nome} - R$ ${dinheiro(
            item.preco * item.quantidade
          )}\n`;


        if (item.observacao) {

          mensagem +=
            `   📝 ${item.observacao}\n`;

        }

      });


      mensagem +=
        `\n💰 *TOTAL: R$ ${dinheiro(
          pedido.total
        )}*`;


      if (pedido.observacaoGeral) {

        mensagem +=
          `\n\n📝 Observação:\n${pedido.observacaoGeral}`;

      }


      const telefone =
        "5549984121585";


      const url =
        "https://wa.me/" +
        telefone +
        "?text=" +
        encodeURIComponent(mensagem);


      alert(
        "🟢 Pedido registrado com sucesso!\n\n" +
        "Pedido: " +
        pedido.numeroPedido
      );


      window.open(
        url,
        "_blank"
      );


      /*
         Limpa o carrinho
      */

      carrinho = [];


      atualizarCarrinho();


      document.getElementById(
        "mesa"
      ).value = "";


      document.getElementById(
        "responsavel"
      ).value = "";


      document.getElementById(
        "observacaoGeral"
      ).value = "";


      fecharPedido();


    } catch (erro) {

      console.error(
        "Erro ao registrar pedido:",
        erro
      );


      alert(
        "❌ Não foi possível registrar o pedido.\n\n" +
        "Código: " +
        (erro.code || "não informado") +
        "\n\n" +
        "Erro: " +
        (erro.message || erro)
      );

    } finally {

      botao.disabled = false;

      botao.textContent =
        "📲 Enviar Pedido";

    }

  };


  /* =====================================================
     TESTAR FIREBASE
  ====================================================== */

  window.testarFirebase = async function() {

    alert(
      "🔄 Testando o Firebase...\n\nAguarde."
    );


    try {

      const ref =
        collection(
          db,
          "pedidos"
        );


      const teste = {

        teste: true,

        mensagem:
          "TESTE FIREBASE",

        data:
          new Date().toISOString()

      };


      const resultado =
        await addDoc(
          ref,
          teste
        );


      alert(
        "🟢 FIREBASE FUNCIONOU!\n\n" +
        "O teste foi salvo no Firestore.\n\n" +
        "ID:\n" +
        resultado.id
      );


    } catch (erro) {

      console.error(
        "Erro no teste Firebase:",
        erro
      );


      alert(
        "🔴 FIREBASE DEU ERRO\n\n" +
        "Código:\n" +
        (erro.code || "não informado") +
        "\n\n" +
        "Mensagem:\n" +
        (erro.message || erro)
      );

    }

  };


  /* =====================================================
     INICIALIZAÇÃO
  ====================================================== */

  mostrarProdutos(produtos);

  atualizarCarrinho();

</script>
