/*

function formatarPreco(valor) {

return Number(valor).toLocaleString(
"pt-BR",
{
minimumFractionDigits: 2,
maximumFractionDigits: 2
}
);

}



/*
============================================================
TOTAL
============================================================
*/


function obterTotal() {

return pedido.reduce(

(total, item) => {

return total +
Number(item.preco) *
Number(item.quantidade);

},

0

);

}

ATUALIZAR CARRINHO

);

/*

ADICIONAR PRODUTO
============================================================
*/


window.adicionarProduto =
function(id) {

const produto =
produtos.find(
p => p.id === id
);


if (!produto)
return;


const existente =
pedido.find(
item => item.id === id
);


if (existente) {

existente.quantidade++;

} else {

pedido.push({

id:
produto.id,

nome:
produto.nome,

preco:
produto.preco,

categoria:
produto.categoria,

quantidade:
1,

observacao:
""

});

}


atualizarCarrinho();

};

/*
============================================================
QUANTIDADE
============================================================
*/


window.aumentarQuantidade =
function(index) {

if (!pedido[index])
return;


pedido[index].quantidade++;


mostrarCarrinho();

};



window.diminuirQuantidade =
function(index) {

if (!pedido[index])
return;


if (
pedido[index].quantidade > 1
) {

pedido[index].quantidade--;

} else {

pedido.splice(
index,
1
);

}


mostrarCarrinho();

};



window.removerProduto =
function(index) {

pedido.splice(
index,
1
);


mostrarCarrinho();

};



window.alterarObservacao =
function(
index,
valor
) {

if (pedido[index]) {

pedido[index].observacao =
valor;

}

};



/*
============================================================
DATA
============================================================
*/


function obterHorario() {

return new Date().toLocaleTimeString(
"pt-BR",
{
hour: "2-digit",
minute: "2-digit"
}
);

}


function obterData() {

return new Date().toLocaleDateString(
"pt-BR"
);

}



/*
============================================================
NÚMERO DO PEDIDO

NÃO consulta todos os pedidos.

============================================================
*/


function gerarNumeroPedido() {

const agora =
new Date();


const hora =
String(
agora.getHours()
).padStart(
2,
"0"
);


const minuto =
String(
agora.getMinutes()
).padStart(
2,
"0"
);


const segundo =
String(
agora.getSeconds()
).padStart(
2,
"0"
);


const milissegundo =
String(
agora.getMilliseconds()
).padStart(
3,
"0"
);


return (
hora +
minuto +
segundo +
milissegundo
);

}



/*
============================================================
SALVAR PEDIDO
============================================================
*/


async function salvarPedidoNoSistema() {

console.log(
"🔥 Tentando salvar pedido..."
);


const ref =
collection(
db,
"pedidos"
);


const mesa =
document.getElementById(
"mesa"
).value.trim();


const responsavel =
document.getElementById(
"responsavel"
).value.trim();


const observacaoGeral =
document.getElementById(
"observacaoGeral"
).value.trim();


const numero =
gerarNumeroPedido();


const pedidoSistema = {

numero:
numero,

mesa:
mesa,

responsavel:
responsavel,

nomeCliente:
responsavel,

horario:
obterHorario(),

data:
obterData(),

status:
"recebido",

observacaoGeral:
observacaoGeral,

itens:

pedido.map(
item => ({

nome:
item.nome,

preco:
Number(item.preco),

quantidade:
Number(item.quantidade),

categoria:
item.categoria || "",

observacao:
item.observacao || ""

})
),

total:
Number(
obterTotal().toFixed(2)
),

dataCriacao:
new Date().toISOString()

};


console.log(
"📦 Pedido:",
pedidoSistema
);


const docRef =
await addDoc(
ref,
pedidoSistema
);


console.log(
"✅ PEDIDO SALVO!",
docRef.id
);


return {

...pedidoSistema,

idFirebase:
docRef.id

};

}



/*
============================================================
WHATSAPP
============================================================
*/


function enviarWhatsApp(
pedidoSistema
) {

let mensagem =
`🍔 *NOVO PEDIDO - SABOR DA CASA*%0A%0A`;


mensagem +=
`📋 *Pedido:* #${pedidoSistema.numero}%0A`;


mensagem +=
`🪑 *Mesa:* ${pedidoSistema.mesa}%0A`;


mensagem +=
`👤 *Responsável:* ${pedidoSistema.responsavel}%0A`;


mensagem +=
`📅 *Data:* ${pedidoSistema.data}%0A`;


mensagem +=
`⏰ *Horário:* ${pedidoSistema.horario}%0A%0A`;


mensagem +=
`*ITENS:*%0A`;


pedidoSistema.itens.forEach(
item => {

mensagem +=
`• ${item.quantidade}x ${item.nome} - R$ ${formatarPreco(item.preco * item.quantidade)}%0A`;


if (item.observacao) {

mensagem +=
`  📝 ${item.observacao}%0A`;

}

});


if (
pedidoSistema.observacaoGeral
) {

mensagem +=
`%0A📝 *Observação:* ${pedidoSistema.observacaoGeral}%0A`;

}


mensagem +=
`%0A💰 *TOTAL: R$ ${formatarPreco(pedidoSistema.total)}*`;


const url =
`https://wa.me/${TELEFONE_WHATSAPP}?text=${mensagem}`;


window.open(
url,
"_blank"
);

}
